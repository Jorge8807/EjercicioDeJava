<DOCTYPE html>
    <html>
        <head>
            <title>Calculadora IMC</title>
            <link rel="stylesheet" href="style.css">
        </head>
        <body>
            <div class="card">
                <h1>Calculadora</h1>
                <label>Valor 1</label>
                <input type="text" id="cajaValorUno"></input>
                <label>Valor 2</label>
                <input type="text" id="cajaValorDos"></input>
                <div class="buttons">
                    <button onclick="suma();">Suma</button> 
                    <button onclick="resta();">Resta</button> 
                    <button onclick="multiplicar();">Multiplicar</button> 
                    <button onclick="division();">Division</button> 
                    <button onclick="IMC();">IMC</button> 
                    <button onclick="celsiusAFahrenheit();">Celsius a Fahrenheit</button> 
                </div>
                <script src="calculadora.js"></script>
                <label>Resultado: </label>
                <input type="text" id="cajaresultado" disabled></input>
            </div>
        </body>
    </html>
</DOCTYPE>
